name: Asana Event Reconciliation

on:
  schedule:
    # Every 30 minutes, to catch Asana events that webhook delivery missed.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  reconcile-asana-events:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL || 'https://kazi.growthpad.africa' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verify credentials
        if: env.CRON_SECRET == ''
        run: |
          echo "::error::CRON_SECRET is not configured in GitHub Actions."
          exit 1
      - name: Reconcile selected Asana projects
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/integrations/asana/reconcile"
