name: Coffee Chat Matching

on:
  schedule:
    - cron: "15 8 1 * *"
  workflow_dispatch:

jobs:
  generate-matches:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL || 'https://kazi.growthpad.africa' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verify credentials
        if: env.CRON_SECRET == ''
        run: exit 1
      - name: Generate private monthly matches
        if: env.CRON_SECRET != ''
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/pulse/coffee-chats"
