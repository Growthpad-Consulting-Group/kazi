name: Google Job Indexing

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  notify-google:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL || 'https://kazi.growthpad.africa' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verify worker credentials
        if: env.CRON_SECRET == ''
        run: |
          echo "::notice::Skipping job indexing because CRON_SECRET is not configured in GitHub Actions."
      - name: Notify Google about scheduled job changes
        if: env.CRON_SECRET != ''
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/hire/jobs/indexing-worker"
