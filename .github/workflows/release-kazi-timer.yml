name: Release Kazi Timer

on:
  push:
    branches: [main]
    paths:
      - "extensions/kazi-timer/**"
      - ".github/workflows/release-kazi-timer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kazi-timer-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check whether this version needs a release
        id: version
        run: |
          VERSION=$(node -p "require('./extensions/kazi-timer/manifest.json').version")
          PUBLISHED=$(sed -n 's/.*version="\([^"]*\)".*/\1/p' public/extensions/kazi-timer/updates.xml | head -1)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$PUBLISHED" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Kazi Timer $VERSION is already published."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Chrome signing key
        if: steps.version.outputs.release == 'true'
        env:
          KAZI_TIMER_CRX_KEY_BASE64: ${{ secrets.KAZI_TIMER_CRX_KEY_BASE64 }}
        run: |
          test -n "$KAZI_TIMER_CRX_KEY_BASE64"
          # GitHub secrets can retain line wrapping from macOS's base64 command.
          # Accept both standard and URL-safe base64, but never log key material.
          KEY=$(printf '%s' "$KAZI_TIMER_CRX_KEY_BASE64" | tr -d '[:space:]' | tr '_-' '/+')
          if ! printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/kazi-timer.pem"; then
            echo "::error::KAZI_TIMER_CRX_KEY_BASE64 is not valid base64. Re-create it with: base64 < extensions/kazi-timer.pem | tr -d '\\n' | pbcopy"
            exit 1
          fi
          if ! openssl pkey -in "$RUNNER_TEMP/kazi-timer.pem" -noout; then
            echo "::error::KAZI_TIMER_CRX_KEY_BASE64 decoded successfully but is not a valid PEM private key."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/kazi-timer.pem"

      - name: Package signed Chrome extension
        if: steps.version.outputs.release == 'true'
        run: |
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable)
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --pack-extension=extensions/kazi-timer --pack-extension-key="$RUNNER_TEMP/kazi-timer.pem"
          mv extensions/kazi-timer.crx public/extensions/kazi-timer/kazi-timer.crx

      - name: Build Firefox source package
        if: steps.version.outputs.release == 'true'
        run: node extensions/kazi-timer/build-firefox.mjs

      - name: Sign Firefox extension with AMO
        if: steps.version.outputs.release == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$AMO_JWT_ISSUER"
          test -n "$AMO_JWT_SECRET"
          pnpm dlx web-ext@8 sign \
            --source-dir extensions/kazi-timer/build/firefox \
            --artifacts-dir "$RUNNER_TEMP/firefox-signed" \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Publish self-hosted update artifacts
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          XPI=$(find "$RUNNER_TEMP/firefox-signed" -type f -name '*.xpi' | head -1)
          test -n "$XPI"
          cp "$XPI" "public/extensions/kazi-timer/firefox/kazi-timer-$VERSION.xpi"
          node extensions/kazi-timer/update-release-manifests.mjs "$VERSION" "public/extensions/kazi-timer/firefox/kazi-timer-$VERSION.xpi"

      - name: Commit signed release artifacts
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/extensions/kazi-timer
          git commit -m "chore(extension): release Kazi Timer v$VERSION"
          git push
