name: Reward Point Expiry

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  expire-points:
    runs-on: ubuntu-latest
    env:
      APP_URL: "${{ secrets.APP_URL || vars.APP_URL || 'https://kazi.growthpad.africa' }}"
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - if: env.CRON_SECRET == ''
        run: echo "::error::CRON_SECRET is not configured in GitHub Actions."
      - if: env.CRON_SECRET != ''
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/pulse/rewards/expiry-worker"
